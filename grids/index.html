function _hubOrigin(){ return (location.protocol!=="file:"&&location.origin&&location.origin!=="null")?location.origin:"*"; }   /* the hub is always our own site */
const EMBED=(function(){ try{ return window.parent!==window; }catch(e){ return true; } })();
const KEY="eyadGrids.v1";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- palette for select options / highlights ---------- */
const PAL=[["#817eff","#e9e7ff"],["#1e915f","#e3f5ec"],["#c66a2b","#f7e7d6"],["#d1495b","#fbe9ec"],
  ["#2f7ec2","#e0eefb"],["#c98a1e","#fbf1dd"],["#7a52c9","#efe8fb"],["#6a5f86","#ece9f5"]];

/* ---------- persistence ---------- */
let DB={folders:{},sheets:{},deleted:{},ui:{cwd:null,open:null}};   /* filled by the hub (grids:init) — no template */
function load(){ let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){ try{ return JSON.parse(raw); }catch(e){
    /* never let a demo workbook overwrite real (but unreadable) data — keep a copy first */
    try{ localStorage.setItem(KEY+".corrupt."+Date.now(), raw); }catch(_){}
    setTimeout(()=>{ try{ toast("Your saved grids couldn't be read — a backup copy was kept on this device"); }catch(_){} },800); } }
  return seed(); }
let _saveT=null;
let _saveWarned=false;
const UI_KEY="hubGrids.ui";   /* which folder/grid is open is per-device, not synced */
let _gridsReady=false, _pendingUpdate=null, _hashes={}, _forcePush=false;
function save(){ try{ localStorage.setItem(UI_KEY,JSON.stringify(DB.ui||{})); }catch(e){} clearTimeout(_saveT); _saveT=setTimeout(flushSave,300); }
/* stamp `updated` on every folder/grid whose content changed, so the hub can merge per grid across devices */
/* content signature — view state (active tab, sort, filters) is left out, so merely LOOKING at a grid a
   different way never makes this device's older copy "newer" than an edit made elsewhere */
function _itemSig(x){ const c=Object.assign({},x); delete c.updated; delete c.ancestors; delete c.activeTab; delete c.fav;
  if(Array.isArray(c.tabs)) c.tabs=c.tabs.map(t=>{ if(!t||(t.sort===undefined&&t.filters===undefined&&t.activeView===undefined&&t.activeFilter===undefined&&t.filterEnabled===undefined&&!(t.pivot&&t.pivot.snap))) return t; const u=Object.assign({},t); delete u.sort; delete u.filters; delete u.activeView; delete u.activeFilter; delete u.filterEnabled; if(u.pivot&&u.pivot.snap){ u.pivot=Object.assign({},u.pivot); delete u.pivot.snap; } return u; });   /* the dashboard snapshot is derived — refreshing it isn't an edit */
  return JSON.stringify(c); }
function _viewSig(x){ return JSON.stringify([x.activeTab||"",(x.tabs||[]).map(t=>[t.sort||null,t.filters||null,t.activeView||null,t.activeFilter||null,t.filterEnabled!==false]),!!x.fav]); }
let _vhashes={};
function stampChanged(){ const now=Date.now(); let changed=false; const seen={};
  [["s",DB.sheets],["f",DB.folders]].forEach(([p,map])=>{ Object.values(map||{}).forEach(x=>{ const k=p+x.id; seen[k]=1; const h=_itemSig(x);
    if(_hashes[k]!==h){ if(_hashes[k]!==undefined||!x.updated){ if(x.updated) x.ancestors=Array.from(new Set((x.ancestors||[]).concat([x.updated]))).slice(-128); x.updated=Math.max(now,(+x.updated||0)+1); } _hashes[k]=h; changed=true; }
    { const v=_viewSig(x); if(_vhashes[k]!==v){ _vhashes[k]=v; changed=true; } } }); });   /* view-only changes are saved, but don't bump `updated` */
  Object.keys(_hashes).forEach(k=>{ if(!seen[k]){ delete _hashes[k]; changed=true; } });
  return changed; }
function rebaseline(){ _hashes={}; _vhashes={}; [["s",DB.sheets],["f",DB.folders]].forEach(([p,map])=>{ Object.values(map||{}).forEach(x=>{ _hashes[p+x.id]=_itemSig(x); _vhashes[p+x.id]=_viewSig(x); }); }); }
function gridsPayload(){ return {v:1,folders:DB.folders,sheets:DB.sheets,deleted:DB.deleted||{},rev:Date.now()}; }
function flushSave(){ clearTimeout(_saveT); _saveT=null; if(!EMBED||!_gridsReady) return; try{ _pvRefreshPins(); }catch(e){}
  const ch=stampChanged(); if(!ch&&!_forcePush) return;   /* only navigation changed — nothing to sync */
  _forcePush=false;
  _sync.pending=true; _sync.err=false; _sync.sentAt=Date.now(); try{ paintSync(); }catch(e){}

  try{ if(window.parent.__gridsSave){ window.parent.__gridsSave(JSON.parse(JSON.stringify(payload)),_acct); return; } }catch(e){}   /* same-origin: synchronous, survives page close */

    if(!_saveWarned){ _saveWarned=true; try{ toast("Couldn't save — reload the Workspace to keep your changes."); }catch(_){} } } }
function tomb(id){ DB.deleted=DB.deleted||{}; DB.deleted[id]=Date.now(); }
/* same rule the hub uses: per folder/grid, the newer edit wins; deletions win over older copies */
function mergeGridsDB(a,b){
  a=a||{};b=b||{};const del=Object.assign({},a.deleted||{});Object.keys(b.deleted||{}).forEach(k=>{del[k]=Math.max(+del[k]||0,+b.deleted[k]||0);});

  const content=x=>{const c=JSON.parse(JSON.stringify(x));['updated','ancestors','activeTab','fav'].forEach(k=>delete c[k]);(c.tabs||[]).forEach(t=>{delete t.sort;delete t.filters;delete t.activeView;delete t.activeFilter;delete t.filterEnabled;if(t.pivot)delete t.pivot.snap;});return JSON.stringify(c);};

  function pick(A,B,recover){A=A||{};B=B||{};const out={},copies={};new Set([...Object.keys(A),...Object.keys(B)]).forEach(id=>{const x=A[id],y=B[id];let winner=x||y;if(x&&y){const sx=content(x),sy=content(y);winner=time(y)>time(x)?y:time(y)<time(x)?x:(sy>sx?y:x);const loser=winner===x?y:x;if(del[id]&&del[id]>=time(winner))return;
      /* A descendant already includes the other revision. Divergent revisions retain the loser. */
      if(recover&&sx!==sy&&!winner.recoveredFrom&&!(winner.ancestors||[]).includes(time(loser))){const copy=JSON.parse(JSON.stringify(loser)),key=id+'-recovered-'+hash(content(loser)+'|'+time(loser));if(!(del[key]&&del[key]>=time(loser))){copy.id=key;copy.name=(loser.name||'Grid')+' · recovered conflict';copy.recoveredFrom=id;copy.recoveredAt=Math.max(time(x),time(y));copies[key]=copy;}}
    }if(winner&&!(del[id]&&del[id]>=time(winner)))out[id]=winner;});Object.keys(copies).forEach(k=>{if(!out[k])out[k]=copies[k];});return out;}
  return {v:1,folders:pick(a.folders,b.folders,false),sheets:pick(a.sheets,b.sheets,true),deleted:del,rev:Math.max(+a.rev||0,+b.rev||0)};
}

function applyIncoming(db,first){ db=db||{};
  if(first){ DB.folders=db.folders||{}; DB.sheets=db.sheets||{}; DB.deleted=db.deleted||{};
    let ui=null; try{ ui=JSON.parse(localStorage.getItem(UI_KEY)||"null"); }catch(e){} DB.ui=Object.assign({cwd:null,open:null},ui||{}); }
  else {
    const mine={folders:DB.folders,sheets:DB.sheets,deleted:DB.deleted};
    if(JSON.stringify({f:db.folders||{},s:db.sheets||{}})===JSON.stringify({f:DB.folders,s:DB.sheets})) return;
    stampChanged();                                     /* keep any local edit made since the hub's copy */
    const m=mergeGridsDB(mine,db); DB.folders=m.folders; DB.sheets=m.sheets; DB.deleted=m.deleted;
    /* we still hold edits the hub's copy doesn't have — send the merged result back */
    if(JSON.stringify({f:m.folders,s:m.sheets})!==JSON.stringify({f:db.folders||{},s:db.sheets||{}})){ _forcePush=true; setTimeout(flushSave,0); } }
  if(first){ try{ if(purgeOldTrash()) _forcePush=true; }catch(e){} }   /* Trash keeps things for 30 days */
  if(DB.ui.open&&(!DB.sheets[DB.ui.open]||isTrashed("sheet",DB.ui.open))) DB.ui.open=null;
  if(DB.ui.cwd&&DB.ui.cwd!=="__trash"&&isTrashed("folder",DB.ui.cwd)) DB.ui.cwd=null;
  if(DB.ui.cwd&&DB.ui.cwd!=="__trash"&&!DB.folders[DB.ui.cwd]) DB.ui.cwd=null;
  Object.values(DB.sheets).forEach(d=>{ try{ ensureTabs(d); d.tabs.forEach(t=>t.rows.forEach(r=>{ if("_hl" in r&&!r._hl) delete r._hl; })); }catch(e){} });   /* upgrade old one-sheet grids before the baseline, so opening one isn't an "edit" */
  rebaseline(); try{ _hs.key=null; }catch(e){}   /* changes that came from another device aren't logged as this user's edits */
  if(!first){ if(EDITING) return; render(); } }
function setTheme(dark){ const was=document.documentElement.classList.contains("dark"); document.documentElement.classList.toggle("dark",!!dark); if(was!==!!dark&&_gridsReady&&!EDITING) render(); }
let _gFocus=false;
function toggleFocus(on){ if(!EMBED) return; const want=(on==null)?!_gFocus:!!on; try{ window.parent.postMessage({type:"grids:focus",on:want},_hubOrigin()); }catch(e){} }
function applyFocus(on){ _gFocus=!!on; document.documentElement.classList.toggle("gfocus",_gFocus); const b=document.querySelector(".fs-btn"); if(b){ b.title=_gFocus?"Exit full screen (Esc)":"Full screen (Ctrl+Shift+F)"; b.innerHTML=_gFocus?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'; } setTimeout(fitToolbar,60); }
/* tools that don't fit collapse into a "More" menu instead of spilling off the edge (Google-Sheets style) */
function fitToolbar(){ const bar=document.querySelector(".ftool"); if(!bar) return;
  let more=bar.querySelector(".fmore");
  if(!more){ more=document.createElement("button"); more.className="fbtn fmore"; more.title="More tools"; more.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'; more.onclick=e=>{ e.stopPropagation(); toolOverflowMenu(e); }; bar.appendChild(more); }
  const kids=[...bar.children].filter(c=>c!==more); kids.forEach(k=>k.classList.remove("ovf")); more.style.display="none";
  if(bar.scrollWidth<=bar.clientWidth+1) return;
  more.style.display=""; const L=bar.getBoundingClientRect().left, limit=bar.clientWidth-more.offsetWidth-14; let cut=false;
  kids.forEach(k=>{ if(cut||k.getBoundingClientRect().right-L>limit){ cut=true; k.classList.add("ovf"); } });
  const vis=kids.filter(k=>!k.classList.contains("ovf")); const last=vis[vis.length-1]; if(last&&last.classList.contains("fdiv")) last.classList.add("ovf"); }
function toolOverflowMenu(e){ const bar=document.querySelector(".ftool"); if(!bar) return; const items=[...bar.querySelectorAll(".ovf")];
  const el=document.createElement("div"); el.className="ctx toolovf"; const r=e.currentTarget.getBoundingClientRect();

const ZOOMS=[0.5,0.67,0.75,0.8,0.9,1,1.1,1.25,1.5,1.75,2];
function gZoom(){ const d=curDoc(); const z=d&&DB.ui&&DB.ui.zoom&&DB.ui.zoom[d.id]; return (typeof z==="number"&&z>=0.25&&z<=3)?z:1; }
function topVisibleRowId(){ const tw=document.getElementById("twrap"); if(!tw) return null; const th=tw.querySelector("thead"); const top=tw.getBoundingClientRect().top+(th?th.getBoundingClientRect().height:0);
  const tr=[...document.querySelectorAll("#gbody tr:not(.vspace)")].find(t=>t.getBoundingClientRect().bottom>top+2); const td=tr&&tr.querySelector("td[data-r]"); return td?td.getAttribute("data-r"):null; }
function setZoom(z){ const d=curDoc(); if(!d) return; z=Math.max(0.5,Math.min(2,Math.round(z*100)/100)); const z0=gZoom(); const tw0=document.getElementById("twrap"); const st=tw0?tw0.scrollTop:0, sl=tw0?tw0.scrollLeft:0; const anchor=topVisibleRowId();
  DB.ui.zoom=DB.ui.zoom||{}; if(z===1) delete DB.ui.zoom[d.id]; else DB.ui.zoom[d.id]=z; closeCtx(); save(); renderEditor();
  /* keep the same rows/columns in view */
  const tw=document.getElementById("twrap"); if(tw&&z0){ tw.scrollLeft=sl*z/z0;
    const ix=(_virt.on&&anchor)?_virt.vr.findIndex(r=>r.id===anchor):-1;
    tw.scrollTop=ix>=0?_virt.offs[ix]*z:st*z/z0; try{ renderVirtBody(true); }catch(e){} } }
function zoomStep(dir){ const z=gZoom(); let i=ZOOMS.findIndex(v=>Math.abs(v-z)<0.001); if(i<0) i=ZOOMS.findIndex(v=>v>z)-(dir>0?1:0); const n=ZOOMS[Math.max(0,Math.min(ZOOMS.length-1,i+dir))]; if(n!==z) setZoom(n); }
function zoomMenu(e){ const z=gZoom(); ctxAt(e,`<div class="lbl">Zoom</div>`+ZOOMS.map(v=>`<button onclick="setZoom(${v})"><span class="mtx">${Math.round(v*100)}%</span>${Math.abs(v-z)<0.001?'<svg class="mrck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12l5 5L20 7"/></svg>':""}</button>`).join("")); }

function vizRanges(sh,vc){ const out={}; const ctx=newCtx(); vc.forEach(c=>{ if(!c.viz||!VIZ[c.viz]) return; let mn=Infinity,mx=-Infinity; sh.rows.forEach(r=>{ const v=rawCellVal(sh,r,c,ctx); if(isBlank(v)||isFErr(v)||isDateStr(String(v))) return; const n=numOrNaN(v); if(isNaN(n)) return; if(n<mn) mn=n; if(n>mx) mx=n; }); if(mn<=mx) out[c.id]={mn,mx}; }); return out; }
/* returns {cls, style, inner} to decorate a numeric cell */
function vizCell(col,v,R,hasFill){ const P=VIZ[col.viz]; if(!P||!R||isBlank(v)||isFErr(v)||isDateStr(String(v))) return null; const n=numOrNaN(v); if(isNaN(n)) return null;
  const t=R.mx>R.mn?(n-R.mn)/(R.mx-R.mn):0.5;
  if(P.kind==="scale"){ if(hasFill) return null; const s=P.stops; const seg=t<=.5?0:1, u=t<=.5?t*2:(t-.5)*2; const c=s[seg].map((x,i)=>Math.round(x+(s[seg+1][i]-x)*u)); const a=P.fade?(0.12+0.5*t):0.34;
    return {cls:" vzs",style:`--vz:rgba(${c.join(",")},${a.toFixed(2)});`}; }
  const lo=Math.min(0,R.mn), hi=Math.max(0,R.mx), span=(hi-lo)||1; const z=(0-lo)/span*100; const p=(n-lo)/span*100; const left=Math.min(z,p), w=Math.max(1.5,Math.abs(p-z));
  return {cls:" vzbar",inner:`<span class="vzb${n<0?" neg":""}" style="left:${left.toFixed(1)}%;width:${w.toFixed(1)}%;--vzc:${n<0?"209,73,91":P.c}"></span>`}; }

  const caseFn=s=>st.caseMode==="upper"?s.toUpperCase():st.caseMode==="lower"?s.toLowerCase():st.caseMode==="sentence"?s.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z\u00E0-\u024F])/g,(m,a,b)=>a+b.toUpperCase()):s.toLowerCase().replace(/(^|[\s\-\/(])([a-z\u00E0-\u024F])/g,(m,a,b)=>a+b.toUpperCase());
  const caseScan=()=>{ const out=[]; used().forEach(r=>{ const v=r.cells[st.col]; if(typeof v==="string"&&v&&v[0]!=="="&&caseFn(v)!==v) out.push(r); }); return out; };
  const splitFn=s=>{ s=String(s==null?"":s).trim(); if(!s) return []; if(st.sep==="first"){ const i=s.search(/\s/); return i<0?[s]:[s.slice(0,i),s.slice(i).trim()]; } if(st.sep==="last"){ const i=s.search(/\s\S*$/); return i<=0?[s]:[s.slice(0,i).trim(),s.slice(i).trim()]; }

  const draw=()=>{if((st.tab==="case"||st.tab==="split")&&!textCols().some(c=>c.id===st.col))st.col=(textCols()[0]||{}).id; const seg=(k,l)=>`<button type="button" data-t="${k}" class="${st.tab===k?"on":""}">${l}</button>`;

function _agoShort(t){ const s=Math.max(0,(Date.now()-t)/1000); if(s<10) return "just now"; if(s<60) return Math.floor(s/5)*5+"s ago"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago"; return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

    case "blank": s=""; break; case "err": s=`<span class="fxe">${esc(n.v)}</span>`; break; case "name": s=`<span class="fxe">${esc(n.v)}</span>`; break;
    case "cell": s=`<span class="fxr">${esc((n.sheet?n.sheet+"!":"")+n.v)}</span>`; break; case "range": s=`<span class="fxr">${esc((n.sheet?n.sheet+"!":"")+n.a+":"+n.b)}</span>`; break;

  const val=n=>{ try{ return evalAst(n.orig,sh,rid,ctx); }catch(e){ return "#ERROR!"; } };

  const sub=(n,agg)=>{ if(n.k==="cell"||n.k==="range"||n.k==="name") return {k:"lit",v:val(n),orig:n.orig};

let _measEl=null;
/* measure a string's rendered width using the EXACT font of a reference element (header name or cell),

function _measureLike(ref,text){ if(!_measEl){ _measEl=document.createElement("span"); _measEl.style.cssText="position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:-9999px"; document.body.appendChild(_measEl); }

function _fitWidth(sh,col,ctx){
  const hn=document.querySelector(`.hname[data-hname="${col.id}"]`); const th=hn&&hn.closest("th");

  const overhead=(hn&&th)?(th.getBoundingClientRect().width-hn.getBoundingClientRect().width):112;
  const headerW=Math.ceil(_measureLike(hn,col.name)+Math.max(overhead,40)+10);

  let w=Math.max(contentW,headerW); w=Math.min(w,Math.max(420,headerW)); return Math.max(70,Math.round(w)); }

function cleanupInconsistentPlan(sh, rows, cols, state) {
  const groups = [];
  cols.forEach(c => {
    if (!['text', 'select', 'multiselect'].includes(c.type)) return;
    const byValue = new Map();
    rows.forEach(r => {
      const value = r.cells[c.id];

      byValue.get(value).push(r);
    });

      parent = values.map((_, i) => i),
      root = i => {
        while (parent[i] !== i) i = parent[i];
        return i;
      };
    for (let i = 0; i < values.length; i++) for (let j = i + 1; j < values.length; j++) {
      const a = cleanupNormal(values[i]),
        b = cleanupNormal(values[j]);

    }
    const clusters = new Map();
    values.forEach((v, i) => {
      const k = root(i);
      if (!clusters.has(k)) clusters.set(k, []);
      clusters.get(k).push({
        value: v,
        rows: byValue.get(v)

    });

        variants

function advancedCleanupDialog(mode) {
  const sh = curSheet();
  if (!sh || sheetLocked(sh)) return lockToast();
  const state = cleanupSelection();
  state.order = '';
  state.serial = false;
  if (!state.colIds.size) state.colIds = new Set(sh.columns.map(c => c.id));
  const b = document.createElement('div');
  let plan = [],
    rows = [],
    cols = [];
  const decisions = new Map(),
    excluded = new Set();

    dates: 'Standardise dates',
    empty: 'Remove empty rows',
    merge: 'Merge records',
    flags: 'Flag inconsistent values'

    rows = state.scope === 'selection' ? sh.rows.filter(r => state.rowIds.has(r.id)) : state.scope === 'filtered' ? visibleRows(sh) : sh.rows;
    cols = sh.columns.filter(c => state.colIds.has(c.id));
    plan = mode === 'dates' ? cleanupDatePlan(sh, rows, cols, state) : mode === 'empty' ? cleanupEmptyPlan(sh, rows) : mode === 'merge' ? cleanupMergePlan(sh, rows, cols) : cleanupInconsistentPlan(sh, rows, cols, state);

    if (mode === 'dates') preview = plan.map(x => `<div>Row ${rn(x.r)} · ${esc(x.c.name)}: ${esc(x.old)} → ${x.error ? `<span style="color:var(--danger)">${esc(x.error)}</span>` : esc(x.value)}</div>`).join('');
    if (mode === 'empty') preview = plan.map(r => `<div>Remove row ${rn(r)}</div>`).join('');
    if (mode === 'flags') preview = plan.map(g => `<div><strong>${esc(g.c.name)}</strong>: ${g.variants.map(v => `${esc(v.value)} (${v.rows.length})`).join(' · ')}</div>`).join('');
    if (mode === 'merge') preview = plan.map(g => {
      g.fields.forEach(f => {
        if (f.conflict) f.choice = decisions.get(g.keeper.id + ':' + f.c.id) || null;
      });
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><label><input type="checkbox" data-merge-group="${g.keeper.id}" ${excluded.has(g.keeper.id) || g.blocked ? '' : 'checked'} ${g.blocked ? 'disabled' : ''}> Keep row ${rn(g.keeper)}, merge rows ${g.donors.map(rn).join(', ')}</label>${g.blocked ? `<p class="hint">${esc(g.blocked)}</p>` : g.fields.map(f => f.conflict ? `<label class="fld"><span class="lb">${esc(f.c.name)} · choose a value</span>${selHTML('mergeChoice_' + g.keeper.id + '_' + f.c.id, [{
        value: '',
        label: 'Choose a value'
      }, ...f.variants.map(v => ({
        value: v.row.id,
        label: 'Row ' + rn(v.row) + ': ' + String(v.value)

    }).join('');
    b.innerHTML = `<label class="fld"><span class="lb">Scope</span>${selHTML('advancedScope', [{
      value: 'selection',
      label: 'Selected cells'
    }, {
      value: 'filtered',
      label: 'Visible rows'
    }, {
      value: 'all',
      label: 'All rows'
    }], state.scope)}</label>${mode !== 'empty' ? `<div class="fld"><span class="lb">${mode === 'merge' ? 'Match records using' : 'Columns'}</span><label><input type="checkbox" id="advancedAll" ${cols.length === sh.columns.length ? 'checked' : ''}> All columns</label><div style="display:flex;flex-wrap:wrap;gap:12px">${sh.columns.map(c => `<label><input type="checkbox" data-advanced-column="${c.id}" ${state.colIds.has(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('')}</div></div>` : ''}${mode === 'dates' ? `<label class="fld"><span class="lb">Ambiguous dates</span>${selHTML('advancedOrder', [{
      value: '',

      value: 'dmy',
      label: 'Day first'
    }, {
      value: 'mdy',
      label: 'Month first'
    }], state.order)}</label><label><input type="checkbox" id="advancedSerial" ${state.serial ? 'checked' : ''}> Convert Excel serial dates</label>` : ''}<p class="hint">${mode === 'empty' ? 'Only blank rows between populated rows are removed. Trailing empty rows, notes, links and hierarchy are preserved.' : mode === 'merge' ? 'The first matching row is kept. Empty fields are filled. Choose each conflicting value, or deselect the group to keep its records separate.' : mode === 'flags' ? 'Similar text is flagged for review; the original values stay unchanged.' : 'Only valid, unambiguous conversions are applied. Formulas and locked cells are preserved.'}</p><p>${plan.length} ${mode === 'dates' ? 'cells to review' : mode === 'empty' ? 'empty rows' : mode === 'merge' ? 'matching groups' : 'inconsistent groups'}</p><div class="grid-review">${preview || '<p>No matching data in this scope.</p>'}</div><p id="advancedError" class="hint" role="alert"></p>`;

  document.querySelector('.modal')?.classList.add('wide');
